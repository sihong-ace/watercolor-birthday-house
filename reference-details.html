<main><h1>座机与生日蛋糕 · 造型近景</h1><p>与房间使用同一套 3D 模型，可拖动查看细节。</p><section class="grid"><article><h2>黑色液晶屏座机</h2><div class="view" id="phone"></div><p>左侧听筒、方向键、数字键、绿色液晶屏与橙色免提键。</p></article><article><h2>双层奶油草莓蛋糕</h2><div class="view" id="cake"></div><p>波浪裱花、红色弧形装饰与一支燃着的蜡烛。</p></article></section><p><a href="model.html">返回生日小屋</a></p></main><script src="assets/door-scene.js"></script><script>const previews=['phone','cake'].map(kind=>BirthdayDoor.mountReferencePreview(document.getElementById(kind),kind));addEventListener('pagehide',()=>previews.forEach(p=>p.dispose()));</script></html>
