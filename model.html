<!doctype html>
<html lang="zh-CN" class="at-door">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eedf">
  <title>老家门廊 · 水彩 3D 模型</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="at-door" data-scene-preview="true">

  </section>
  <script src="assets/door-scene.js"></script>

<script src="guide.js"></script>
